<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="427" viewBox="0 0 1160 427"><rect width="100%" height="100%" fill="#111827"/><rect width="100%" height="42" fill="#263244"/><circle cx="22" cy="21" r="6" fill="#ef4444"/><circle cx="44" cy="21" r="6" fill="#f59e0b"/><circle cx="66" cy="21" r="6" fill="#22c55e"/><text x="90" y="27" fill="#e5e7eb" font-family="Arial" font-size="15">Python output — 4A_Task3_Runtime_Models</text><text x="28" y="75" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">4A TASK 3 - RUNTIME AND APP LAUNCH</text><text x="28" y="102" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">1. Launcher requests Activity</text><text x="28" y="129" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">2. ActivityTaskManager resolves package</text><text x="28" y="156" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">3. Zygote forks isolated app process</text><text x="28" y="183" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">4. ART maps/verifies DEX and initialises heap</text><text x="28" y="210" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">5. Application object is created</text><text x="28" y="237" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">6. Activity callbacks run</text><text x="28" y="264" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">7. Views are measured and laid out</text><text x="28" y="291" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">8. Renderer submits first frame</text><text x="28" y="318" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Android: DEX; ART interpreter/JIT/profile-guided AOT; managed heap and GC.</text><text x="28" y="345" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">iOS: native Mach-O; Objective-C runtime; ARC reference counting.</text><text x="28" y="372" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Windows: native PE or managed .NET assembly; CLR JIT for managed code.</text><text x="28" y="399" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Cold start creates process/runtime; warm start may reuse a live process.</text></svg>