<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="319" viewBox="0 0 1160 319"><rect width="100%" height="100%" fill="#111827"/><rect width="100%" height="42" fill="#263244"/><circle cx="22" cy="21" r="6" fill="#ef4444"/><circle cx="44" cy="21" r="6" fill="#f59e0b"/><circle cx="66" cy="21" r="6" fill="#22c55e"/><text x="90" y="27" fill="#e5e7eb" font-family="Arial" font-size="15">Python output — 4B_Task5_Power_Engineering</text><text x="28" y="75" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">4B TASK 5 - POWER ENGINEERING</text><text x="28" y="102" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">DVFS | CPU load/thermal state | Lower voltage/frequency; longer task latency</text><text x="28" y="129" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Doze/App Standby | Screen off, stationary, unplugged | Defer background network/jobs</text><text x="28" y="156" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Batching/WorkManager | Queue threshold and job window | Fewer radio wakeups; later delivery</text><text x="28" y="183" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Measure: adb shell dumpsys batterystats --reset</text><text x="28" y="210" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Run fixed workload, then: adb shell dumpsys batterystats</text><text x="28" y="237" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Compare wakeup alarms, wakelock duration, radio active time, GPS and estimated mAh.</text><text x="28" y="264" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Stress case: continuous partial wakelock reduces deep-sleep/Doze benefit.</text><text x="28" y="291" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Let the OS scheduler choose heterogeneous CPU cores.</text></svg>