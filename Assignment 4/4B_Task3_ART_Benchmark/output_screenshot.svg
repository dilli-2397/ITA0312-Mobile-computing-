<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="292" viewBox="0 0 1160 292"><rect width="100%" height="100%" fill="#111827"/><rect width="100%" height="42" fill="#263244"/><circle cx="22" cy="21" r="6" fill="#ef4444"/><circle cx="44" cy="21" r="6" fill="#f59e0b"/><circle cx="66" cy="21" r="6" fill="#22c55e"/><text x="90" y="27" fill="#e5e7eb" font-family="Arial" font-size="15">Python output — 4B_Task3_ART_Benchmark</text><text x="28" y="75" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">4B TASK 3 - ART BENCHMARK</text><text x="28" y="102" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">CPU workload: prime count below 5000 = 669</text><text x="28" y="129" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Allocation workload: compare bounded and unbounded short-lived objects.</text><text x="28" y="156" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">UI workload: render/scroll a large list and record frame timing.</text><text x="28" y="183" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Test compilation modes if supported: verify, speed-profile, speed.</text><text x="28" y="210" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Command: adb shell cmd package compile -m speed-profile -f &lt;package&gt;</text><text x="28" y="237" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Capture GC logs with adb logcat and heap timeline with Android Studio Memory Profiler.</text><text x="28" y="264" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Leak/ANR tests belong in a disposable test build; never force OOM on a personal device.</text></svg>