<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="265" viewBox="0 0 1160 265"><rect width="100%" height="100%" fill="#111827"/><rect width="100%" height="42" fill="#263244"/><circle cx="22" cy="21" r="6" fill="#ef4444"/><circle cx="44" cy="21" r="6" fill="#f59e0b"/><circle cx="66" cy="21" r="6" fill="#22c55e"/><text x="90" y="27" fill="#e5e7eb" font-family="Arial" font-size="15">Python console output — Q5_DSDV_Proactive_Routing</text><text x="28" y="75" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Q5 - DSDV PROACTIVE ROUTING</text><text x="28" y="102" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Nodes | Update rounds | Table entries | Control updates | Route availability</text><text x="28" y="129" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">10 | 2 | 90 | 20 | 100% (stable topology)</text><text x="28" y="156" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">25 | 4 | 600 | 100 | 100% (stable topology)</text><text x="28" y="183" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">50 | 6 | 2450 | 300 | 100% (stable topology)</text><text x="28" y="210" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Sequence numbers identify fresh routes and help prevent routing loops.</text><text x="28" y="237" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Trade-off: routes are ready when needed, but periodic updates consume bandwidth.</text></svg>