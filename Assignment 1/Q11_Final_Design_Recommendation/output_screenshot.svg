<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="238" viewBox="0 0 1160 238"><rect width="100%" height="100%" fill="#111827"/><rect width="100%" height="42" fill="#263244"/><circle cx="22" cy="21" r="6" fill="#ef4444"/><circle cx="44" cy="21" r="6" fill="#f59e0b"/><circle cx="66" cy="21" r="6" fill="#22c55e"/><text x="90" y="27" fill="#e5e7eb" font-family="Arial" font-size="15">Python output — Q11_Final_Design_Recommendation</text><text x="28" y="75" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Q11 - RECOMMENDED FINAL DESIGN</text><text x="28" y="102" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Hybrid macro-micro network.</text><text x="28" y="129" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Baseline: N=7, R=0.5 km, Q=4.583, 48 channels/cell.</text><text x="28" y="156" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">12 km^2 needs about 19 ideal cells (about 21 with boundary allowance).</text><text x="28" y="183" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Use sectors and micro-cells at hotspots; apply DCA and admission control.</text><text x="28" y="210" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">100,000 users offer 2,500 Erlangs: substantial densification is required.</text></svg>