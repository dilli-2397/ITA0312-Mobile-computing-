<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="265" viewBox="0 0 1160 265"><rect width="100%" height="100%" fill="#111827"/><rect width="100%" height="42" fill="#263244"/><circle cx="22" cy="21" r="6" fill="#ef4444"/><circle cx="44" cy="21" r="6" fill="#f59e0b"/><circle cx="66" cy="21" r="6" fill="#22c55e"/><text x="90" y="27" fill="#e5e7eb" font-family="Arial" font-size="15">Python output — Q10_Theory_vs_Simulation</text><text x="28" y="75" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Q10 - THEORY VS SIMULATION</text><text x="28" y="102" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Theory assumes equal-distance interferers; simulation uses individual distances.</text><text x="28" y="129" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Theory may omit shadowing, fading, buildings and antenna side lobes.</text><text x="28" y="156" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Erlang-B assumes random arrivals and no waiting queue.</text><text x="28" y="183" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Mobility and handoff reservations alter real results.</text><text x="28" y="210" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Validate N=7,n=4 SIR at approximately 18.7 dB.</text><text x="28" y="237" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Discuss the cause and design impact of each difference.</text></svg>