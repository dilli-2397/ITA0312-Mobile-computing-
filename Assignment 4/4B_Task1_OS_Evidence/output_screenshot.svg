<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="400" viewBox="0 0 1160 400"><rect width="100%" height="100%" fill="#111827"/><rect width="100%" height="42" fill="#263244"/><circle cx="22" cy="21" r="6" fill="#ef4444"/><circle cx="44" cy="21" r="6" fill="#f59e0b"/><circle cx="66" cy="21" r="6" fill="#22c55e"/><text x="90" y="27" fill="#e5e7eb" font-family="Arial" font-size="15">Python output — 4B_Task1_OS_Evidence</text><text x="28" y="75" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">4B TASK 1 - ANDROID VS IOS EVIDENCE</text><text x="28" y="102" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Android: Linux -&gt; HAL -&gt; native libraries -&gt; ART -&gt; framework -&gt; app; zygote; Binder.</text><text x="28" y="129" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">iOS: XNU/Core OS -&gt; Core Services -&gt; Media -&gt; Cocoa Touch; launchd; XPC/Mach ports.</text><text x="28" y="156" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Run on your own emulator/device; output depends on device and OS:</text><text x="28" y="183" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">$ adb shell getprop ro.build.version.release</text><text x="28" y="210" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">$ adb shell ps -A</text><text x="28" y="237" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">$ adb shell dumpsys activity processes</text><text x="28" y="264" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">$ adb shell dumpsys meminfo &lt;package.name&gt;</text><text x="28" y="291" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">$ adb shell service list</text><text x="28" y="318" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">$ adb shell cat /proc/&lt;pid&gt;/status</text><text x="28" y="345" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Capture PID, UID, PSS/RSS, process importance, lifecycle and OS version.</text><text x="28" y="372" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">This helper does not fabricate live device measurements.</text></svg>