<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="456" viewBox="0 0 1200 456">
<rect width="100%" height="100%" fill="#111827"/><rect width="100%" height="42" fill="#263244"/>
<circle cx="22" cy="21" r="6" fill="#ef4444"/><circle cx="44" cy="21" r="6" fill="#f59e0b"/><circle cx="66" cy="21" r="6" fill="#22c55e"/>
<text x="90" y="27" fill="#e5e7eb" font-family="Arial" font-size="15">Python console output — Q2_Mobile_IP_and_Mobility_Management</text>
<text x="26" y="76" fill="#d1fae5" font-family="Consolas, monospace" font-size="16">Q2 - MOBILE IP REGISTRATION AND TUNNELLING</text>
<text x="26" y="103" fill="#d1fae5" font-family="Consolas, monospace" font-size="16">1. Mobile Node enters foreign network</text>
<text x="26" y="130" fill="#d1fae5" font-family="Consolas, monospace" font-size="16">2. Foreign Agent provides Care-of Address</text>
<text x="26" y="157" fill="#d1fae5" font-family="Consolas, monospace" font-size="16">3. Mobile Node sends registration request</text>
<text x="26" y="184" fill="#d1fae5" font-family="Consolas, monospace" font-size="16">4. Home Agent authenticates request</text>
<text x="26" y="211" fill="#d1fae5" font-family="Consolas, monospace" font-size="16">5. Home Agent updates binding: Home IP -&gt; Care-of Address</text>
<text x="26" y="238" fill="#d1fae5" font-family="Consolas, monospace" font-size="16">6. Registration reply reaches Mobile Node</text>
<text x="26" y="265" fill="#d1fae5" font-family="Consolas, monospace" font-size="16">7. Correspondent packet reaches Home Agent</text>
<text x="26" y="292" fill="#d1fae5" font-family="Consolas, monospace" font-size="16">8. Home Agent tunnels packet to Care-of Address</text>
<text x="26" y="319" fill="#d1fae5" font-family="Consolas, monospace" font-size="16">9. Foreign Agent delivers packet to Mobile Node</text>
<text x="26" y="346" fill="#d1fae5" font-family="Consolas, monospace" font-size="16">Original packet size: 1000 bytes</text>
<text x="26" y="373" fill="#d1fae5" font-family="Consolas, monospace" font-size="16">Encapsulated packet size: 1020 bytes</text>
<text x="26" y="400" fill="#d1fae5" font-family="Consolas, monospace" font-size="16">Tunnelling overhead: 20 bytes (2.0%)</text>
<text x="26" y="427" fill="#d1fae5" font-family="Consolas, monospace" font-size="16">Result: the Home Agent forwards traffic to the mobile node's current location.</text>
</svg>