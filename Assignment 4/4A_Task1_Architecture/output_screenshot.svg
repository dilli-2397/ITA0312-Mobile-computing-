<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="373" viewBox="0 0 1160 373"><rect width="100%" height="100%" fill="#111827"/><rect width="100%" height="42" fill="#263244"/><circle cx="22" cy="21" r="6" fill="#ef4444"/><circle cx="44" cy="21" r="6" fill="#f59e0b"/><circle cx="66" cy="21" r="6" fill="#22c55e"/><text x="90" y="27" fill="#e5e7eb" font-family="Arial" font-size="15">Python output — 4A_Task1_Architecture</text><text x="28" y="75" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">4A TASK 1 - ANDROID ARCHITECTURE</text><text x="28" y="102" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">1. Hardware: CPU, RAM, modem, sensors</text><text x="28" y="129" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">2. Linux kernel + drivers: Scheduling, memory, drivers, Binder</text><text x="28" y="156" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">3. HAL: Vendor hardware interfaces</text><text x="28" y="183" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">4. Native libraries/services: Graphics, media, SQLite, TLS, system services</text><text x="28" y="210" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">5. ART: DEX verification, JIT/AOT, garbage collection</text><text x="28" y="237" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">6. Application framework: Activities, services, permissions, notifications</text><text x="28" y="264" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">7. Applications: UI, business logic and data</text><text x="28" y="291" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Call path: App -&gt; Framework API -&gt; Binder service -&gt; HAL/native code -&gt; Kernel driver</text><text x="28" y="318" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Security: UID sandbox + SELinux + permission checks + Keystore</text><text x="28" y="345" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Power: PowerManager/Doze + kernel suspend/DVFS</text></svg>