<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="265" viewBox="0 0 1160 265"><rect width="100%" height="100%" fill="#111827"/><rect width="100%" height="42" fill="#263244"/><circle cx="22" cy="21" r="6" fill="#ef4444"/><circle cx="44" cy="21" r="6" fill="#f59e0b"/><circle cx="66" cy="21" r="6" fill="#22c55e"/><text x="90" y="27" fill="#e5e7eb" font-family="Arial" font-size="15">Python output — Q4_Best_Average_Worst_Performance</text><text x="28" y="75" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Q4 - BEST, AVERAGE AND WORST SIR</text><text x="28" y="102" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Baseline six-interferer estimate (N=7,n=3.5): about 15.4 dB</text><text x="28" y="129" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Best: close to serving base station, strong desired signal.</text><text x="28" y="156" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Average: typical user location and propagation.</text><text x="28" y="183" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Worst: cell edge/corner, weaker desired signal and nearby interferers.</text><text x="28" y="210" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">1.5x serving distance causes about 6.2 dB desired-link loss.</text><text x="28" y="237" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Use mean, median and 5th-percentile SIR in evaluation.</text></svg>