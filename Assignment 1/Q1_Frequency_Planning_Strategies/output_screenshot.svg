<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="211" viewBox="0 0 1160 211"><rect width="100%" height="100%" fill="#111827"/><rect width="100%" height="42" fill="#263244"/><circle cx="22" cy="21" r="6" fill="#ef4444"/><circle cx="44" cy="21" r="6" fill="#f59e0b"/><circle cx="66" cy="21" r="6" fill="#22c55e"/><text x="90" y="27" fill="#e5e7eb" font-family="Arial" font-size="15">Python output — Q1_Frequency_Planning_Strategies</text><text x="28" y="75" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Q1 - FREQUENCY PLANNING STRATEGIES</text><text x="28" y="102" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Fixed reuse: 336/7 = 48 channels per cell; simple and predictable.</text><text x="28" y="129" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Sectorisation: directional antennas reduce dominant co-channel interference.</text><text x="28" y="156" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Macro-micro + DCA: add small cells at hotspots and coordinate dynamic channels.</text><text x="28" y="183" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Recommendation: hybrid macro-micro with sectorisation at busy sites.</text></svg>