<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="238" viewBox="0 0 1160 238"><rect width="100%" height="100%" fill="#111827"/><rect width="100%" height="42" fill="#263244"/><circle cx="22" cy="21" r="6" fill="#ef4444"/><circle cx="44" cy="21" r="6" fill="#f59e0b"/><circle cx="66" cy="21" r="6" fill="#22c55e"/><text x="90" y="27" fill="#e5e7eb" font-family="Arial" font-size="15">Python output — Q5_Scaling_Sensitivity</text><text x="28" y="75" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Q5 - SCALING AND SENSITIVITY</text><text x="28" y="102" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Channels/cell: N=3:112, N=4:84, N=7:48, N=12:28</text><text x="28" y="129" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Increasing N improves reuse distance but reduces channels/cell.</text><text x="28" y="156" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Halving radius -&gt; one-quarter area -&gt; about 4x cell count.</text><text x="28" y="183" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">100,000 users x 0.025 Erlang = 2,500 Erlangs.</text><text x="28" y="210" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Large demand requires small cells, sectors and traffic management.</text></svg>