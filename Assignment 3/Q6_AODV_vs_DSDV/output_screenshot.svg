<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="292" viewBox="0 0 1160 292"><rect width="100%" height="100%" fill="#111827"/><rect width="100%" height="42" fill="#263244"/><circle cx="22" cy="21" r="6" fill="#ef4444"/><circle cx="44" cy="21" r="6" fill="#f59e0b"/><circle cx="66" cy="21" r="6" fill="#22c55e"/><text x="90" y="27" fill="#e5e7eb" font-family="Arial" font-size="15">Python console output — Q6_AODV_vs_DSDV</text><text x="28" y="75" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Q6 - AODV VS DSDV ROUTING COMPARISON</text><text x="28" y="102" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Mobility | Nodes | DSDV periodic updates | AODV route requests | DSDV setup delay | AODV setup delay</text><text x="28" y="129" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Low | 10 | 10 | 2 | 5 ms | 15 ms</text><text x="28" y="156" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Medium | 25 | 25 | 5 | 5 ms | 25 ms</text><text x="28" y="183" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">High | 50 | 50 | 10 | 5 ms | 40 ms</text><text x="28" y="210" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">DSDV keeps routes ready but sends periodic updates.</text><text x="28" y="237" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">AODV discovers routes on demand, reducing idle updates but adding discovery delay.</text><text x="28" y="264" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">For frequent topology changes, AODV is generally preferred in this model.</text></svg>