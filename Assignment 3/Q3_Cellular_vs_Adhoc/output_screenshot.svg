<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="292" viewBox="0 0 1160 292"><rect width="100%" height="100%" fill="#111827"/><rect width="100%" height="42" fill="#263244"/><circle cx="22" cy="21" r="6" fill="#ef4444"/><circle cx="44" cy="21" r="6" fill="#f59e0b"/><circle cx="66" cy="21" r="6" fill="#22c55e"/><text x="90" y="27" fill="#e5e7eb" font-family="Arial" font-size="15">Python console output — Q3_Cellular_vs_Adhoc</text><text x="28" y="75" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Q3 - CELLULAR VS AD HOC NETWORK</text><text x="28" y="102" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Cellular path: Mobile-A -&gt; Base-Station -&gt; Core-Network -&gt; Server</text><text x="28" y="129" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Cellular hops: 3</text><text x="28" y="156" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Ad hoc path: Mobile-A -&gt; Node-B -&gt; Node-C -&gt; Server</text><text x="28" y="183" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Ad hoc hops: 3</text><text x="28" y="210" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Cellular: infrastructure and base station required.</text><text x="28" y="237" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Ad hoc: nodes forward packets without fixed base-station infrastructure.</text><text x="28" y="264" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Disaster case: ad hoc communication remains possible if relay nodes form a connected path.</text></svg>