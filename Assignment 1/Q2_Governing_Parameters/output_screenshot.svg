<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="346" viewBox="0 0 1160 346"><rect width="100%" height="100%" fill="#111827"/><rect width="100%" height="42" fill="#263244"/><circle cx="22" cy="21" r="6" fill="#ef4444"/><circle cx="44" cy="21" r="6" fill="#f59e0b"/><circle cx="66" cy="21" r="6" fill="#22c55e"/><text x="90" y="27" fill="#e5e7eb" font-family="Arial" font-size="15">Python output — Q2_Governing_Parameters</text><text x="28" y="75" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Q2 - GOVERNING DESIGN PARAMETERS</text><text x="28" y="102" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Township area: 12 km^2</text><text x="28" y="129" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Spectrum: 336 duplex channels</text><text x="28" y="156" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Cluster size N: 7</text><text x="28" y="183" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Cell radius: 0.5 km (planning assumption)</text><text x="28" y="210" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Path-loss exponent n: 3.5</text><text x="28" y="237" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">SIR target: 14 dB</text><text x="28" y="264" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Traffic per user: 0.025 Erlang</text><text x="28" y="291" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Blocking target: 2%</text><text x="28" y="318" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Larger N improves SIR but reduces channels per cell; smaller cells increase sites and handoffs.</text></svg>