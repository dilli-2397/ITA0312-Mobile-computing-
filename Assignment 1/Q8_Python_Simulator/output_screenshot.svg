<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="184" viewBox="0 0 1160 184"><rect width="100%" height="100%" fill="#111827"/><rect width="100%" height="42" fill="#263244"/><circle cx="22" cy="21" r="6" fill="#ef4444"/><circle cx="44" cy="21" r="6" fill="#f59e0b"/><circle cx="66" cy="21" r="6" fill="#22c55e"/><text x="90" y="27" fill="#e5e7eb" font-family="Arial" font-size="15">Python output — Q8_Python_Simulator</text><text x="28" y="75" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Q8 - REPRODUCIBLE SIMULATOR BASELINE</text><text x="28" y="102" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Evaluates N=3,4,7,12; integer channels/cell; Erlang-B at 2% blocking; SIR at n=4.</text><text x="28" y="129" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Known sanity check: N=7,n=4 -&gt; 18.7 dB.</text><text x="28" y="156" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">A full Monte Carlo extension needs fixed random seed, sampled mobile locations, shadowing and antenna patterns.</text></svg>