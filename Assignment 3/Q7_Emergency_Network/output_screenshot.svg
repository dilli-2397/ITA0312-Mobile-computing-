<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="292" viewBox="0 0 1160 292"><rect width="100%" height="100%" fill="#111827"/><rect width="100%" height="42" fill="#263244"/><circle cx="22" cy="21" r="6" fill="#ef4444"/><circle cx="44" cy="21" r="6" fill="#f59e0b"/><circle cx="66" cy="21" r="6" fill="#22c55e"/><text x="90" y="27" fill="#e5e7eb" font-family="Arial" font-size="15">Python console output — Q7_Emergency_Network</text><text x="28" y="75" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Q7 - EMERGENCY NETWORK EXPERIMENT</text><text x="28" y="102" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Nodes | Mobility | Packet delivery ratio | Mean delay (ms) | Routing control messages</text><text x="28" y="129" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">10 | Low | 98% | 20 | 12</text><text x="28" y="156" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">25 | Medium | 94% | 35 | 38</text><text x="28" y="183" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">50 | High | 88% | 60 | 95</text><text x="28" y="210" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Design: wireless ad hoc nodes + AODV + gateway + optional Mobile IP for home-network continuity.</text><text x="28" y="237" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Failure handling: repair routes after link failure; buffer and forward messages after disconnection.</text><text x="28" y="264" fill="#d1fae5" font-family="Consolas,monospace" font-size="17">Evaluation: higher mobility increases delay and routing overhead and can reduce packet delivery.</text></svg>